name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi cryptography pymongo redis mongomock fakeredis
      - run: PYTHON=python ./tests/run.sh

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cp desktop/plugin.js /tmp/plugin.mjs && node --check /tmp/plugin.mjs
